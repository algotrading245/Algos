<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurum Research Control</title>
<!-- Served by tools/live_server.py at http://127.0.0.1:8765/ . Reads /api/research, /api/job, /api/doc (read-only,
     tools/research_api.py), /api/state and /stream (agent relay).  No external scripts, fonts or images. -->
<style>
:root{
  --bg:#F5F7FB;--surface:#FFFFFF;--surface2:#F8FAFC;--text:#172033;--text2:#667085;--muted:#98A2B3;
  --border:#E4E9F1;--border2:#D5DDE8;--gold:#D9A441;--gold-tx:#8A6117;--gold-bg:#FBF3E2;
  --blue:#3978F6;--blue-bg:#EAF1FE;--cyan:#16A6C7;--cyan-bg:#E6F6FA;--teal:#0EAA91;--teal-bg:#E4F6F3;
  --purple:#8B5CF6;--purple-bg:#F1ECFE;--indigo:#5B63E6;--indigo-bg:#EDEEFD;
  --ok:#15966A;--ok-bg:#E5F5EE;--warn:#D99016;--warn-tx:#9A620A;--warn-bg:#FCF2E1;--err:#DC4C55;--err-bg:#FCE9EA;
  --neutral:#718096;--neutral-bg:#EEF1F5;
  --r:8px;--r-lg:12px;--shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --shadow-lg:0 12px 32px rgba(16,24,40,.12),0 2px 6px rgba(16,24,40,.06);
  --sans:Inter,"Segoe UI Variable","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --mono:"Cascadia Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
  --side:232px;color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:400 14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--text2)}.faint{color:var(--muted)}
.hide{display:none!important}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:15px;height:15px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);height:100vh}
.app.collapsed{--side:68px}
.side{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;transition:width .2s}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;height:64px}
.brand .wm{font-weight:650;letter-spacing:.18em;font-size:15px;color:var(--gold-tx)}
.brand svg{width:28px;height:28px;flex:none}
.nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:var(--r);color:var(--text2);font-weight:500;position:relative;white-space:nowrap}
.nav a:hover{background:var(--surface2);color:var(--text);text-decoration:none}
.nav a.on{background:var(--gold-bg);color:var(--gold-tx)}
.nav a.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav .cnt{margin-left:auto;background:var(--err);color:#fff;border-radius:99px;font-size:11px;font-weight:600;min-width:19px;height:19px;display:grid;place-items:center;padding:0 5px}
.side-foot{padding:16px 18px;border-top:1px solid var(--border);font-size:11.5px;color:var(--muted);line-height:1.55}
.side-foot b{display:block;color:var(--gold-tx);letter-spacing:.16em;font-size:12px;margin-bottom:4px}
.collapse-btn{margin:0 10px 10px;display:flex;align-items:center;gap:10px;padding:8px 12px;border:0;background:transparent;color:var(--muted);border-radius:var(--r);cursor:pointer}
.collapse-btn:hover{background:var(--surface2);color:var(--text)}
.app.collapsed .brand .wm,.app.collapsed .nav a span,.app.collapsed .side-foot,.app.collapsed .collapse-btn span{display:none}
.app.collapsed .nav a{justify-content:center;padding:10px}
.app.collapsed .nav .cnt{position:absolute;top:2px;right:4px;min-width:16px;height:16px;font-size:10px}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.crumb{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumb span{color:var(--muted);font-weight:500}
.top .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.pill .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.demo{background:var(--ok-bg);color:var(--ok);border-color:#BFE6D5}
.pill.demo .short{display:none}
.pill.conn{background:var(--neutral-bg);color:var(--neutral)}
.pill.conn.live{background:var(--ok-bg);color:var(--ok)}
.pill.conn.bad{background:var(--err-bg);color:var(--err)}
.clock{color:var(--text2);font-size:13px;white-space:nowrap}
.searchbtn{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface2);color:var(--muted);cursor:pointer;min-width:200px}
.searchbtn:hover{border-color:var(--border2)}
.searchbtn kbd{margin-left:auto;font:11px var(--mono);border:1px solid var(--border);border-radius:4px;padding:1px 5px;background:#fff}
.iconbtn{position:relative;width:36px;height:36px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:var(--r);cursor:pointer;color:var(--text2)}
.iconbtn:hover{background:var(--surface2);color:var(--text)}
.iconbtn .badge{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:99px;background:var(--blue);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 4px}
.menu-btn{display:none}
.content{flex:1;overflow:auto;padding:20px;min-height:0}
.page{max-width:1680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.page-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.page-h h1{font-size:20px;font-weight:650;margin:0;letter-spacing:-.01em}
.page-h p{margin:2px 0 0;color:var(--text2);font-size:13px}
.page-h .sp{flex:1}

/* ---------- cards, generic ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.card-h h2{font-size:14px;font-weight:600;margin:0}
.card-h .sp{flex:1}
.card-h .link{font-size:12.5px;font-weight:500}
.card-b{padding:14px 16px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{padding:16px;display:flex;gap:14px;align-items:flex-start;cursor:pointer;transition:border-color .15s,box-shadow .15s;text-align:left;width:100%;font:inherit;color:inherit}
.kpi:hover{border-color:var(--border2);box-shadow:var(--shadow-lg)}
.kpi .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.kpi .lb{font-size:12.5px;color:var(--text2);font-weight:500}
.kpi .v{font-size:24px;font-weight:650;letter-spacing:-.01em;line-height:1.25;margin-top:2px}
.kpi .v small{font-size:13px;font-weight:500;color:var(--text2);margin-left:4px}
.kpi .s{font-size:12px;color:var(--text2);margin-top:4px;line-height:1.45}
.kpi .tag{display:inline-block;font-size:10.5px;font-weight:600;color:var(--gold-tx);background:var(--gold-bg);border-radius:4px;padding:1px 6px;margin-top:6px}
.kpi .body{flex:1;min-width:0}
.ring{flex:none}
.tone-gold{background:var(--gold-bg);color:var(--gold-tx)}.tone-blue{background:var(--blue-bg);color:var(--blue)}
.tone-teal{background:var(--teal-bg);color:var(--teal)}.tone-purple{background:var(--purple-bg);color:var(--purple)}
.tone-cyan{background:var(--cyan-bg);color:var(--cyan)}.tone-ok{background:var(--ok-bg);color:var(--ok)}
.tone-warn{background:var(--warn-bg);color:var(--warn-tx)}.tone-err{background:var(--err-bg);color:var(--err)}
.tone-neutral{background:var(--neutral-bg);color:var(--neutral)}.tone-indigo{background:var(--indigo-bg);color:var(--indigo)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 9px 2px 7px;white-space:nowrap;line-height:1.5}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.queued,.st.awaiting,.st.pending,.st.hold,.st.not_checked{background:var(--warn-bg);color:var(--warn-tx)}
.st.running,.st.active{background:var(--blue-bg);color:var(--blue)}
.st.done,.st.completed,.st.verified,.st.approved,.st.applied,.st.matched,.st.pass{background:var(--ok-bg);color:var(--ok)}
.st.failed,.st.violated,.st.rejected,.st.invalid,.st.fail,.st.worse{background:var(--err-bg);color:var(--err)}
.st.blocked,.st.idle,.st.unknown,.st.none{background:var(--neutral-bg);color:var(--neutral)}
.st.running::before{animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.3}}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--border);border-radius:99px;background:var(--surface);color:var(--text2);font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--border2);color:var(--text)}
.chip[aria-pressed=true]{background:var(--blue-bg);border-color:#C9DBFC;color:var(--blue)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface2);border-color:var(--border2)}
.btn.pri{background:var(--text);border-color:var(--text);color:#fff}.btn.pri:hover{opacity:.88}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.danger{color:var(--err);border-color:#F3C5C8}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r);padding:2px;background:var(--surface2)}
.seg button{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:var(--text2);font-size:13px;font-weight:500;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--blue);box-shadow:0 1px 2px rgba(16,24,40,.1)}
input.f,select.f{height:32px;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);padding:0 10px;font-size:13px;min-width:0}
input.f:focus,select.f:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{padding:28px 16px;text-align:center;color:var(--text2);font-size:13px}
.empty b{display:block;color:var(--text);font-weight:600;margin-bottom:4px;font-size:14px}
.skel{background:linear-gradient(90deg,var(--surface2),#EEF2F7,var(--surface2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:6px;height:14px;margin:8px 0}
@keyframes sk{to{background-position:-200% 0}}
.note{font-size:12px;color:var(--text2);background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;line-height:1.5}
.note.warn{background:var(--warn-bg);border-color:#F1DDB5;color:var(--warn-tx)}
.note.err{background:var(--err-bg);border-color:#F3C5C8;color:#A3333B}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;font-size:13px}
.kv dt{color:var(--text2)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv.stack{grid-template-columns:1fr;gap:2px}.kv.stack dt{font-size:12px;margin-top:8px}.kv.stack dt:first-child{margin-top:0}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:flex-start;padding:11px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface2)}
.row .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}
.row .t{font-weight:500;font-size:13px;line-height:1.4}
.row .d{font-size:12px;color:var(--text2);line-height:1.45;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .w{margin-left:auto;font-size:11.5px;color:var(--muted);white-space:nowrap;text-align:right}
.tbl-wrap{overflow:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:600;font-size:12px;color:var(--text2);padding:9px 12px;border-bottom:1px solid var(--border);background:var(--surface2);white-space:nowrap;position:sticky;top:0;z-index:1}
table.t td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
table.t tbody tr{cursor:pointer}
table.t tbody tr:hover td{background:var(--surface2)}
table.t tbody tr.sel td{background:var(--blue-bg)}
table.t td.r,table.t th.r{text-align:right}
.pos{color:var(--ok)}.neg{color:var(--err)}

/* ---------- overview layout ---------- */
.ov-mid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px}
.ov-bot{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr) minmax(0,1.3fr);gap:16px}

/* ---------- graph ---------- */
.gcard{display:flex;flex-direction:column;overflow:hidden}
.gbar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.gbar .sp{flex:1}
.gfilters{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--surface)}
.gwrap{position:relative;flex:1;min-height:520px;background-color:#FBFCFE;background-image:radial-gradient(#DCE3EE 1px,transparent 1px);background-size:22px 22px;overflow:hidden;touch-action:none}
.gwrap svg.g{position:absolute;inset:0;width:100%;height:100%;cursor:grab;user-select:none}
.gwrap svg.g.panning{cursor:grabbing}
.gzoom{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.gzoom button{width:34px;height:32px;border:0;border-bottom:1px solid var(--border);background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--text2)}
.gzoom button:last-child{border-bottom:0}.gzoom button:hover{background:var(--surface2);color:var(--text)}
.minimap{position:absolute;left:12px;bottom:12px;width:180px;height:112px;background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);cursor:pointer}
.legend{position:absolute;right:12px;bottom:12px;background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:var(--r);padding:6px 10px;font-size:11px;color:var(--text2);display:flex;gap:10px;flex-wrap:wrap;max-width:60%}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.tip{position:absolute;pointer-events:none;background:var(--text);color:#fff;font-size:12px;line-height:1.4;padding:6px 9px;border-radius:6px;max-width:280px;box-shadow:var(--shadow-lg);z-index:5;opacity:0;transition:opacity .1s}
.tip.on{opacity:1}
.tip b{font-weight:600}.tip span{color:#C9D2E0}
g.n{cursor:pointer}
g.n text{font-family:var(--sans);pointer-events:none}
svg.g{--ls:1}
g.n .lbl{font-size:calc(12px * var(--ls));font-weight:600;fill:var(--text)}
g.n .sub{font-size:calc(10.5px * var(--ls));fill:var(--text2)}
g.n .sml{font-size:calc(10px * var(--ls));fill:var(--text2)}
g.n.wf .lbl,g.n.wf .sub,g.n.wf .sml{--ls:1}
g.n.dim,path.e.dim{opacity:.18}
g.n.hl .halo{opacity:1}
g.n .halo{opacity:0;transition:opacity .15s}
path.e{fill:none;stroke:#C6D0DE;stroke-width:1.2}
svg.g.far g.n:not(.hl) text.lab{opacity:0}
svg.g.far.hassel g.n:not(.dim) text.lab{opacity:1}
svg.g g.n:hover text.lab{opacity:1}
path.e.flow{stroke:#9FB4D6;stroke-width:1.8}
path.e.hl{stroke:var(--blue);stroke-width:2.2;opacity:1}
path.e.anim{stroke-dasharray:6 6;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
.glist{flex:1;overflow:auto;min-height:520px}

/* ---------- relay ---------- */
.agent-row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border)}
.agent-row .av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.agent-row .nm{font-weight:600;font-size:13px}.agent-row .md{font-size:12px;color:var(--text2)}
.agent-row .r{margin-left:auto;text-align:right;font-size:11.5px;color:var(--muted)}
.handoff{font:12.5px var(--mono);background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;color:var(--text);overflow-wrap:anywhere}

/* ---------- pipeline board ---------- */
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;align-items:start}
.col{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-lg);display:flex;flex-direction:column;min-height:120px}
.col-h{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.col-h b{font-size:13px}.col-h small{color:var(--muted);font-size:11.5px}
.col-h .n{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--text2);background:var(--surface);border:1px solid var(--border);border-radius:99px;padding:0 8px}
.col-b{padding:10px;display:flex;flex-direction:column;gap:10px}
.ccard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px;cursor:pointer;box-shadow:var(--shadow)}
.ccard:hover{border-color:var(--border2)}
.ccard.sel{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-bg)}
.ccard .nm{font-weight:600;font-size:13px;line-height:1.35;overflow-wrap:anywhere}
.ccard .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.ccard .ln{font-size:12px;color:var(--text2);margin-top:6px;line-height:1.45}
.tagx{font-size:11px;font-weight:600;border-radius:4px;padding:1px 6px;background:var(--neutral-bg);color:var(--text2)}

/* ---------- inspector / overlays ---------- */
.insp{position:fixed;top:64px;right:0;bottom:0;width:440px;max-width:100vw;background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--shadow-lg);z-index:30;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s ease}
.insp.on{transform:none}
.insp.wide{width:640px}
.insp-h{display:flex;gap:10px;align-items:flex-start;padding:16px;border-bottom:1px solid var(--border)}
.insp-h .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.insp-h h3{margin:0;font-size:15px;font-weight:650;line-height:1.35;overflow-wrap:anywhere}
.insp-h .ty{font-size:12px;color:var(--text2)}
.insp-b{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.insp-b h4{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.04em}
.insp-b p{margin:0;font-size:13px;line-height:1.55;overflow-wrap:anywhere}
.rel{display:flex;flex-direction:column;gap:4px}
.rel button{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:var(--r);padding:6px 9px;font-size:12.5px;cursor:pointer}
.rel button:hover{background:var(--surface2)}
.rel .dir{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.scrim{position:fixed;inset:0;background:rgba(23,32,51,.32);z-index:40;display:grid;place-items:start center;padding:8vh 16px 16px}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);width:min(820px,100%);max-height:84vh;display:flex;flex-direction:column;overflow:hidden}
.modal-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-h h3{margin:0;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.modal-b{overflow:auto;padding:16px 20px}
.palette{width:min(640px,100%)}
.palette input{border:0;border-bottom:1px solid var(--border);height:52px;padding:0 18px;font-size:15px;outline:none;width:100%}
.palette .res{max-height:52vh;overflow:auto;padding:6px}
.palette .it{display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:var(--r);cursor:pointer;font-size:13px}
.palette .it.on,.palette .it:hover{background:var(--blue-bg)}
.palette .it small{margin-left:auto;color:var(--muted);font-size:11.5px}
.md{font-size:13.5px;line-height:1.6;overflow-wrap:anywhere}
.md h1{font-size:19px;margin:6px 0 10px}.md h2{font-size:16px;margin:18px 0 8px}.md h3{font-size:14px;margin:14px 0 6px}
.md p{margin:8px 0}.md ul,.md ol{padding-left:22px;margin:6px 0}.md li{margin:3px 0}
.md code{font:12.5px var(--mono);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:0 4px}
.md pre{font:12px/1.5 var(--mono);background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:10px;overflow:auto;white-space:pre}
.md table{border-collapse:collapse;font-size:12.5px;margin:8px 0;display:block;overflow:auto}
.md th,.md td{border:1px solid var(--border);padding:5px 8px;text-align:left}.md th{background:var(--surface2)}
.toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--text);color:#fff;border-radius:var(--r);padding:10px 14px;font-size:13px;box-shadow:var(--shadow-lg);animation:tin .2s;overflow-wrap:anywhere}
.toast.err{background:#A3333B}.toast.ok{background:#0F7553}
@keyframes tin{from{opacity:0;transform:translateY(6px)}}
.pop{position:absolute;top:56px;right:16px;width:min(360px,calc(100vw - 32px));z-index:35;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);max-height:60vh;overflow:auto}
.feed{font-size:12.5px;max-height:520px;overflow:auto}
.feed .ev{padding:7px 14px;border-bottom:1px solid var(--border);display:flex;gap:10px}
.feed .ev .k{flex:none;width:70px;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase}
.feed .ev .x{min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.feed .ev.tool .x{font-family:var(--mono);font-size:12px;color:var(--blue)}
.feed .ev.done .k{color:var(--ok)}
.qf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qf label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text2)}
.qf .w{grid-column:1/-1}
.bar-h{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--border)}
.bar-h i{display:block;height:100%;background:var(--gold)}
.chart{width:100%;height:auto;display:block}
.chart text{font:10.5px var(--sans);fill:var(--text2)}
.split2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.split3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}

/* ---------- responsive ---------- */
@media (max-width:1280px){.ov-bot{grid-template-columns:1fr 1fr}.ov-bot>:last-child{grid-column:1/-1}}
@media (max-width:1100px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ov-mid{grid-template-columns:1fr}
  .split3{grid-template-columns:1fr 1fr}
  .searchbtn{min-width:0}.searchbtn span,.searchbtn kbd{display:none}
}
@media (max-width:900px){
  .app,.app.collapsed{grid-template-columns:1fr;--side:260px}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:50;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow-lg)}
  .app.drawer .side{transform:none}
  .app.collapsed .brand .wm,.app.collapsed .nav a span,.app.collapsed .side-foot{display:revert}
  .app.collapsed .nav a{justify-content:flex-start;padding:9px 12px}
  .collapse-btn{display:none}
  .menu-btn{display:grid}
  .clock{display:none}
  .ov-bot,.split2,.split3{grid-template-columns:1fr}
  .ov-bot>:last-child{grid-column:auto}
}
@media (max-width:640px){
  .top{padding:0 10px;gap:6px}
  .content{padding:12px}
  .kpis{grid-template-columns:1fr}
  .pill.conn span.t{display:none}
  .pill.demo{padding:0 9px;font-size:11px}
  .crumb span,.crumb .home{display:none}
  .pill.demo .long{display:none}.pill.demo .short{display:inline}
  .searchbtn{border:0;background:transparent;padding:0 6px}
  .gwrap,.glist{min-height:60vh}
  .minimap{display:none}.legend{display:none}
  .insp,.insp.wide{top:auto;left:0;width:100%;height:82vh;border-left:0;border-top:1px solid var(--border);border-radius:16px 16px 0 0;transform:translateY(100%)}
  .insp.on{transform:none}
  .qf{grid-template-columns:1fr}
  .row .w{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
.reduce *,.reduce *::before{animation:none!important;transition:none!important}

<script>
"use strict";
/* =====================================================================================================================
   Aurum Research Control. Vanilla JS, no build step, no external requests.
   Data: /api/research (files under docs/, derived figures from logs/), /api/job, /api/doc, /api/state + /stream.
   Nothing on this page can place a trade or change an approval. The only writes are the live server's existing
   owner controls (pause/resume, start an agent, release the T16 hold, queue a tester job), each behind a confirm.
   ===================================================================================================================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const h=(strings,...vals)=>strings.reduce((a,s,i)=>a+s+(i<vals.length?(vals[i]&&vals[i].__raw!==undefined?vals[i].__raw:esc(vals[i])):""),"");
const raw=s=>({__raw:s??""});
const fmtPct=(v,d=2)=>v==null||isNaN(v)?"—":(v>0?"+":"")+Number(v).toFixed(d)+"%";
const fmtNum=(v,d=0)=>v==null||isNaN(v)?"—":Number(v).toLocaleString("en-GB",{maximumFractionDigits:d,minimumFractionDigits:d});
const clip=(s,n)=>{s=String(s??"");return s.length>n?s.slice(0,n-1)+"…":s};
const cap=s=>String(s||"").charAt(0).toUpperCase()+String(s||"").slice(1);
function when(iso){
  if(!iso)return "—";
  const d=new Date(String(iso).replace(" ","T"));
  if(isNaN(d))return String(iso);
  return d.toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit",hour12:false});
}
function ago(iso){
  if(!iso)return "—";
  const d=new Date(String(iso).replace(" ","T")); if(isNaN(d))return String(iso);
  let s=(Date.now()-d)/1000, f=s<0?"in ":"", t=s<0?"":" ago"; s=Math.abs(s);
  const v=s<60?Math.round(s)+" s":s<3600?Math.round(s/60)+" min":s<86400?(s/3600).toFixed(1)+" h":Math.round(s/86400)+" d";
  return f+v+t;
}
const reduceMotion=()=>matchMedia("(prefers-reduced-motion: reduce)").matches||document.documentElement.classList.contains("reduce");
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem("aurum."+k));localStorage.setItem("aurum."+k,JSON.stringify(v))}catch(e){return null}}

/* ---------- icons (hand-drawn 24px line set) ---------- */
const IP={

  graph:'<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="9" cy="18" r="2.5"/><path d="M8.2 7.2 15.7 8M7 8.4l1.4 7.2M10.8 16.3l5.5-6.4"/>',

  beaker:'<path d="M9 3h6M10 3v6L4.5 18.5A1.6 1.6 0 0 0 6 21h12a1.6 1.6 0 0 0 1.5-2.5L14 9V3"/><path d="M7 15h10"/>',
  shield:'<path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6l-7-3Z"/>',
  shieldok:'<path d="M12 3 5 6v6c0 4.5 3 7.5 7 9 4-1.5 7-4.5 7-9V6l-7-3Z"/><path d="m9 12 2 2 4-4"/>',
  log:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/>',
  check:'<circle cx="12" cy="12" r="9"/><path d="m8.5 12.2 2.4 2.4 4.8-5"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  doc:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8l-5-5Z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
  code:'<path d="m8 8-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  db:'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>',
  activity:'<path d="M3 12h4l2.5-6 5 12 2.5-6h4"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  box:'<path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/>',
  trophy:'<path d="M8 4h8v5a4 4 0 0 1-8 0V4ZM8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M9.5 17h5"/>',
  trend:'<path d="m3 17 6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  alert:'<path d="M12 3 2 20h20L12 3Z"/><path d="M12 10v4M12 17h.01"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', minus:'<path d="M5 12h14"/>',
  fit:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  reset:'<path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.5"/><path d="M4 4v4.5h4.5"/>',
  play:'<path d="M7 5v14l11-7L7 5Z"/>', pause:'<path d="M8 5v14M16 5v14"/>',
  ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3Z"/>',
  flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
  route:'<circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="6" r="2.5"/><path d="M8.5 18H15a3.5 3.5 0 0 0 0-7H9a3.5 3.5 0 0 1 0-7h6.5"/>',
  hex:'<path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><circle cx="12" cy="12" r="3"/>',
  dot:'<circle cx="12" cy="12" r="4"/>',
  gate:'<path d="M4 21V8l8-5 8 5v13"/><path d="M9 21v-7h6v7"/>',
  lesson:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5Z"/><path d="M4 19a2 2 0 0 1 2-2h13"/>',
  q:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"/>',
};
const icon=(n,cls="")=>`<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${IP[n]||IP.dot}</svg>`;

/* ---------- state ---------- */
const S={
  data:null, dataSig:"", dataErr:null, lastData:0,
  live:null, conn:"connecting", lastState:0, es:null,
  feed:[], evCount:0, changes:[], unseen:0,
  sel:null, gmode:store("gmode")||"graph",
  gf:{types:null,status:"all",q:"",hist:true},
  page:"overview", route:{}, M:null,
};
const PAGES=[
  ["overview","Overview","home"],["graph","Live Graph","graph"],["agents","Agents","bot"],
  ["pipeline","Strategy Pipeline","pipe"],["jobs","Tester Jobs","beaker"],["routes","Prop Routes","route"],
  ["decisions","Decision Log","log"],["approvals","Approvals","check"],["rules","Rules","shieldok"],["settings","Settings","gear"],
];

/* ---------- networking ---------- */
async function getJSON(url){
  const r=await fetch(url,{cache:"no-store"});
  if(!r.ok)throw new Error(url+" HTTP "+r.status);
  return r.json();
}
function sigOf(d){const c={...d};delete c.generated;delete c.sources;return JSON.stringify(c)}
async function loadResearch(force){
  try{
    const d=await getJSON("/api/research");
    S.dataErr=null; S.lastData=Date.now();
    const sig=sigOf(d);
    if(S.data)diffChanges(S.data,d);
    const changed=sig!==S.dataSig||force;
    S.data=d; S.dataSig=sig;
    if(changed){S.M=buildModel(d);render()}
    else renderTop();
  }catch(e){
    S.dataErr=String(e.message||e); renderTop();
    if(!S.data)render();
  }
}
function connect(){
  if(!window.EventSource){S.conn="unsupported";renderTop();return}
  const es=new EventSource("/stream"); S.es=es;
  es.onopen=()=>{S.conn="live";renderTop()};
  es.onerror=()=>{S.conn="disconnected";renderLive()};
  es.addEventListener("state",m=>{
    try{
      const prev=S.live; S.live=JSON.parse(m.data); S.lastState=Date.now(); S.conn="live";
      const js=j=>(j||[]).map(x=>x.id+x.status).join();
      if(prev&&(js(prev.jobs)!==js(S.live.jobs)||JSON.stringify(prev.relay)!==JSON.stringify(S.live.relay)))loadResearch();
      renderLive();
    }catch(e){console.warn(e)}
  });
  es.onmessage=m=>{try{ingest(JSON.parse(m.data).batch||[])}catch(e){console.warn(e)}};
}
function ingest(batch){
  for(const d of batch){
    S.evCount++;
    let txt=null,k=null;
    if(d.k==="msg"){for(const p of d.parts||[]){
      if(p.k==="text"){k="says";txt=p.s}else if(p.k==="tool"){k="tool";txt=p.name+"  "+clip(p.input,240)}
      else if(p.k==="result"){k=p.err?"error":"result";txt=clip(p.s,240)} else if(p.k==="thinking"){k="thinking";txt=clip(p.s,300)}
      if(txt!=null&&String(txt).trim())S.feed.push({k,role:d.role,run:d.run,t:d.t,s:txt});
      txt=null;
    }continue}
    if(d.k==="init"){k="session";txt=`model ${d.model} · ${d.tools} tools`}
    else if(d.k==="done"){k="done";txt=`${d.ok?"finished":"ended with error"} · ${d.turns??"?"} turns · ${((d.ms||0)/1000).toFixed(0)} s`}
    else if(d.k==="sys"){k="system";txt=d.s}
    if(txt!=null)S.feed.push({k,role:d.role,run:d.run,t:d.t,s:txt});
  }
  if(S.feed.length>400)S.feed.splice(0,S.feed.length-400);
  renderFeed();
}
async function post(path,body){
  try{
    const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json","X-Aurum":"1"},body:JSON.stringify(body||{})});
    const j=await r.json().catch(()=>({ok:false,msg:"HTTP "+r.status}));
    toast(j.msg||("HTTP "+r.status),j.ok?"ok":"err");
  }catch(e){toast(String(e),"err")}
  loadResearch(true);
}

/* ---------- change notifications (diffs of real data only) ---------- */
function diffChanges(a,b){
  const add=(t,s,go)=>{S.changes.unshift({t,s,at:new Date().toISOString(),go});S.unseen++};
  const ja=Object.fromEntries((a.jobs||[]).map(j=>[j.id,j.status]));
  for(const j of b.jobs||[]){
    if(!(j.id in ja))add("New tester job",`${j.id} ${j.expert||""} · ${j.status}`,"job:"+j.id);
    else if(ja[j.id]!==j.status)add("Job status",`${j.id}: ${ja[j.id]} → ${j.status}`,"job:"+j.id);
  }
  const na=(a.decisions||[]).length,nb=(b.decisions||[]).length;
  if(nb>na)for(const d of (b.decisions||[]).slice(0,nb-na))add(d.kind==="question"?"Open question":"New decision",`${d.role}: ${clip(d.decision,90)}`,"decision:"+d._line);
  const aa=Object.fromEntries((a.approvals||[]).map(x=>[x.id,x.status]));
  for(const x of b.approvals||[])if(aa[x.id]!==x.status)add("Approval",`${x.id}: ${aa[x.id]||"new"} → ${x.status}`,"approval:"+x.id);
  if(S.changes.length>50)S.changes.length=50;
}

/* ---------- toasts, modal, confirm ---------- */
function toast(msg,kind=""){
  const t=document.createElement("div");t.className="toast "+kind;t.textContent=msg;$("#toasts").append(t);
  setTimeout(()=>t.remove(),kind==="err"?8000:5000);
}
function modal(title,bodyHTML,opts={}){

    ${opts.noHead?"":`<div class="modal-h"><h3>${esc(title)}</h3><span style="flex:1"></span>${opts.headExtra||""}<button class="iconbtn" data-close aria-label="Close">${icon("x")}</button></div>`}
    <div class="modal-b">${bodyHTML}</div></div>`;
  const prev=document.activeElement;
  const close=()=>{sc.remove();document.removeEventListener("keydown",kd);prev&&prev.focus&&prev.focus()};
  const kd=e=>{if(e.key==="Escape"){e.stopPropagation();close()}};
  sc.addEventListener("click",e=>{if(e.target===sc||e.target.closest("[data-close]"))close()});

function confirmDlg(title,text,okLabel,onOk,danger){

/* ---------- markdown-lite for docs (input is escaped first) ---------- */
function mdInline(s){
  return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,"$1 <code>$2</code>");
}
function md(text){
  const L=String(text||"").replace(/\r/g,"").split("\n");let o="",i=0;
  while(i<L.length){
    const l=L[i];
    if(/^```/.test(l)){let b=[];i++;while(i<L.length&&!/^```/.test(L[i]))b.push(L[i++]);i++;o+=`<pre>${esc(b.join("\n"))}</pre>`;continue}
    const hm=l.match(/^(#{1,4})\s+(.*)/);if(hm){const n=Math.min(3,hm[1].length);o+=`<h${n}>${mdInline(hm[2])}</h${n}>`;i++;continue}
    if(/^\|/.test(l)){let rows=[];while(i<L.length&&/^\|/.test(L[i]))rows.push(L[i++]);
      rows=rows.filter(r=>!/^\|\s*:?-{2,}/.test(r)).map(r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim()));
      o+="<table>"+rows.map((r,k)=>"<tr>"+r.map(c=>k?`<td>${mdInline(c)}</td>`:`<th>${mdInline(c)}</th>`).join("")+"</tr>").join("")+"</table>";continue}
    if(/^\s*([-*]|\d+\.)\s+/.test(l)){const ol=/^\s*\d+\./.test(l);let it=[];
      while(i<L.length&&(/^\s*([-*]|\d+\.)\s+/.test(L[i])||(/^\s{2,}\S/.test(L[i])&&it.length))){
        if(/^\s*([-*]|\d+\.)\s+/.test(L[i]))it.push(L[i].replace(/^\s*([-*]|\d+\.)\s+/,""));else it[it.length-1]+=" "+L[i].trim();i++}
      o+=(ol?"<ol>":"<ul>")+it.map(x=>`<li>${mdInline(x)}</li>`).join("")+(ol?"</ol>":"</ul>");continue}
    if(!l.trim()){i++;continue}
    let p=[];while(i<L.length&&L[i].trim()&&!/^(#{1,4}\s|\||```|\s*([-*]|\d+\.)\s)/.test(L[i]))p.push(L[i++]);
    o+=`<p>${mdInline(p.join(" "))}</p>`;
  }
  return o;
}
async function openDoc(path,title){
  const m=modal(title||path,`<div class="skel"></div><div class="skel" style="width:70%"></div><div class="skel" style="width:85%"></div>`,

    else html=`<div class="md">${md(d.text)}</div>`;
    b.innerHTML=`<p class="faint" style="font-size:12px;margin:0 0 8px">Last modified ${esc(when(d.mtime))}${d.truncated?" · truncated":""} · read-only, credential-like text hidden</p>`+html;
  }catch(e){m.el.querySelector(".modal-b").innerHTML=`<div class="empty"><b>Could not open this file</b>${esc(e.message)}. Only files under docs/ and backtest summaries are served.</div>`}
}

<script>
"use strict";

  ["tester","fidelity"],["fidelity","demo"],["demo","approval"],["approval","live"]];

const ROLE_ALIAS={"tester-operator":"tester"};

function stepsIn(text){
  const out=new Set();const m=String(text||"").match(/(?:steps?|gates?)\s+([\d][\d\s,\-–and]*)/i);
  if(!m)return out;
  for(const part of m[1].split(/,|and/)){const r=part.trim().match(/^(\d+)(?:\s*[-–]\s*(\d+))?/);if(!r)continue;
    const a=+r[1],b=r[2]?+r[2]:a;for(let i=a;i<=b&&i<=20;i++)out.add(i)}

}
function candStatus(c){

  if(c.status==="rejected")return {cls:"rejected",text:"rejected",stopped:true,reason:clip((c.notes||c.summary||"").split(/(?<=\.)\s/)[0],160)};
  if(/^FAIL/i.test(v))return {cls:"failed",text:"stopped · "+v.toLowerCase(),stopped:true,reason:v};
  if(c.status==="live")return {cls:"active",text:"live"};

function jobStatusCls(s){return {queued:"queued",running:"running",done:"done",failed:"failed",hold:"hold"}[s]||"unknown"}
function hydraMonths(d){
  // Latest finished AurumHydra month series on a 5x preset (no extra input overrides): share of months at >= 5x.
  const groups={};
  for(const j of d.jobs||[]){
    if(j.expert!=="AurumHydra"||j.status!=="done"||!j.months||(j.set||[]).length||!/5x/i.test(j.preset||""))continue;
    const rows=(j.result&&j.result.months)||[];if(!rows.length)continue;
    (groups[j.preset]=groups[j.preset]||{preset:j.preset,jobs:[],rows:[],last:""});
    const g=groups[j.preset];g.jobs.push(j.id);g.rows.push(...rows);g.last=[g.last,j.started||""].sort().pop();
  }
  const g=Object.values(groups).sort((a,b)=>a.last<b.last?1:-1)[0];
  if(!g)return null;
  return {...g,hit:g.rows.filter(r=>r.mult>=5).length,n:g.rows.length,median:median(g.rows.map(r=>r.mult))};
}
function median(a){if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2}
function jobResultLine(j){

  if(r&&r.return_pct!=null)return `${fmtPct(r.return_pct)} · ${fmtNum(r.eq_dd_pct,2)}% eq DD`;
  if(r&&r.months){const hit=r.months.filter(x=>x.mult>=5).length;return `${hit}/${r.months.length} months ≥5x · median ${fmtNum(median(r.months.map(x=>x.mult)),2)}x`}
  return null;
}

function buildModel(d){
  const nodes=new Map(),edges=[],ek=new Set();

  const link=(s,t,kind="member")=>{if(!nodes.has(s)||!nodes.has(t)||s===t)return;const k=s+">"+t;if(ek.has(k)||ek.has(t+">"+s))return;ek.add(k);edges.push({s,t,kind})};
  const pipe=(d.pipeline&&d.pipeline.steps)||[];
  const cands=d.candidates||[], jobs=d.jobs||[];
  const anyRunning=jobs.some(j=>j.status==="running"), anyQueued=jobs.some(j=>j.status==="queued");
  const a2=(d.approvals||[]).find(a=>a.id==="a2");
  for(const s of STAGES){
    const here=cands.filter(c=>s.steps.includes(stepNum(c.step))&&!candStatus(c).stopped);

    else if(here.length){status="active";stText=`${here.length} candidate${here.length>1?"s":""}`}

      primary:true,r:24,color:"#D9A441",tone:"gold",icon:"hex"});

  }

    add({id:"agent:"+a.role,type:"agent",label:a.label,sub:(a.model||"model not set")+" · "+a.kind,agent:a,
      status:live&&live.live?"running":"idle",r:15,color:"#5B63E6",tone:"indigo",icon:"bot",updated:a.last&&a.last.ended});
  }
  add({id:"agent:owner",type:"agent",label:"Owner",sub:"step 19 · approvals",status:"idle",r:15,color:"#D9A441",tone:"gold",icon:"user",owner:true});

  for(const a of d.agents||[])for(const n of stepsIn(a.description))(roleSteps[a.role]=roleSteps[a.role]||new Set()).add(n);

    const id="agent:"+r;if(!nodes.has(id))continue;

  }

      status:st.cls,stText:st.text,hist:!!st.stopped,r:8,color:TYPES.candidate.color,icon:"flag",tone:"purple"});

      status:v?(/^PASS/i.test(v)?"pass":"fail"):"unknown",stText:v||"verdict not in ledger",hist:v&&!/^PASS/i.test(v),r:6,color:TYPES.gate.color,icon:"shieldok",tone:"teal"});

      r:a.status==="pending"?9:7,color:a.status==="pending"?"#D99016":"#15966A",icon:"check",tone:a.status==="pending"?"warn":"ok",hist:a.status==="applied"});

  for(const e of edges){adj.get(e.s).out.push(e);adj.get(e.t).in.push(e)}

}

/* =====================================================================================================================
   Graph view: SVG, own force layout (Graph), serpentine node editor (Workflow), table (List).
   Positions, zoom and pan survive data refreshes; only new nodes are placed.
   ===================================================================================================================== */
const G={pos:{graph:{},workflow:{}},view:{graph:null,workflow:null},host:null,svg:null,vp:null,size:[800,520],drag:null,pinch:null,nodeEls:new Map(),edgeEls:[]};
function hash(s){let x=2166136261;for(const c of String(s))x=Math.imul(x^c.charCodeAt(0),16777619);return (x>>>0)/4294967295}
function visibleNodes(){
  const M=S.M;if(!M)return [];
  const f=S.gf,q=f.q.trim().toLowerCase();
  return [...M.nodes.values()].filter(n=>{
    if(S.gmode==="workflow"&&!(n.type==="stage"||n.type==="product"))return false;
    if(n.type!=="stage"&&f.types&&!f.types.has(n.type))return false;
    if(!f.hist&&n.hist)return false;
    if(f.status!=="all"&&n.type!=="stage"&&n.type!=="product"){
      const grp={active:["running","active","awaiting","queued","pending"],done:["done","completed","pass","applied","approved"],failed:["failed","fail","rejected","violated"]}[f.status]||[];
      if(!grp.includes(n.status))return false;
    }
    if(q&&n.type!=="stage"&&!(n.label+" "+(n.full||"")+" "+(n.sub||"")).toLowerCase().includes(q))return false;
    return true;
  });
}
function parentOf(id){

function refreshGraph(){const list=$("#glist");if(S.gmode==="list"&&list)renderGraphList(list);else renderGraphSVG()}
function zoomAt(x,y,f){const v=G.view[S.gmode];if(!v)return;const k=Math.max(0.2,Math.min(3,v.k*f));v.tx=x-(x-v.tx)*(k/v.k);v.ty=y-(y-v.ty)*(k/v.k);v.k=k;applyView()}

    const g=e.target.closest("g.n");const [x,y]=local(e);
    G.drag=g?{id:g.dataset.id,x,y,moved:false,node:true}:{x,y,moved:false,node:false,tx:G.view[S.gmode].tx,ty:G.view[S.gmode].ty};
    if(!g)svg.classList.add("panning");
  };
  svg.onpointermove=e=>{
    const [x,y]=local(e);
    if(pts.has(e.pointerId))pts.set(e.pointerId,[x,y]);
    if(G.pinch&&pts.size===2){const [a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),v=G.view[S.gmode];zoomAt((a[0]+b[0])/2,(a[1]+b[1])/2,(G.pinch.k*d/G.pinch.d)/v.k);return}
    const D=G.drag;
    if(D){
      if(Math.hypot(x-D.x,y-D.y)>4)D.moved=true;
      if(!D.moved)return;
      const v=G.view[S.gmode];
      if(D.node){const p=G.pos[S.gmode][D.id];p.x+=(x-D.x)/v.k;p.y+=(y-D.y)/v.k;D.x=x;D.y=y;moveNode(D.id)}
      else{v.tx=D.tx+(x-D.x);v.ty=D.ty+(y-D.y);applyView()}
      tip.classList.remove("on");return;
    }
    const g=e.target.closest("g.n");
    if(g&&e.pointerType==="mouse"){const n=S.M.nodes.get(g.dataset.id);if(!n)return;
      tip.innerHTML=`<b>${esc(n.full||n.label)}</b><br><span>${esc(TYPES[n.type].label)} · ${esc(n.stText||ST_TEXT[n.status]||n.status)}</span>${n.sub&&n.sub!==n.full?`<br><span>${esc(clip(n.sub,120))}</span>`:""}`;
      const r=G.host.getBoundingClientRect(),wr=$("#gwrap").getBoundingClientRect();
      tip.style.left=Math.min(e.clientX+14,innerWidth-300)+"px";tip.style.top=(e.clientY+14)+"px";tip.style.position="fixed";tip.classList.add("on")}

  svg.ondblclick=e=>{const g=e.target.closest("g.n");if(g)primaryAction(g.dataset.id)};
  svg.onkeydown=e=>{const g=e.target.closest&&e.target.closest("g.n");if(!g)return;if(e.key==="Enter"||e.key===" "){e.preventDefault();select(g.dataset.id)}};
}
function moveNode(id){
  const el=G.nodeEls.get(id),p=G.pos[S.gmode][id];if(el)el.setAttribute("transform",`translate(${p.x},${p.y})`);
  const P=G.pos[S.gmode];
  G.edgeList.forEach((e,i)=>{if(e.s===id||e.t===id)G.edgeEls[i].setAttribute("d",edgePath({...P[e.s],id:e.s},{...P[e.t],id:e.t},e.kind))});

function renderGraphList(el){

    ${all.map(n=>{const p=parentOf(n.id),a=S.M.adj.get(n.id);return `<tr data-id="${esc(n.id)}" class="${S.sel===n.id?"sel":""}" tabindex="0">

      <td><b style="font-weight:500">${esc(clip(n.full||n.label,70))}</b><div class="faint" style="font-size:12px">${esc(clip(n.sub||"",90))}</div></td>
      <td class="muted">${esc(n.type==="stage"?(n.steps.map(s=>s.n).join(", ")||"—"):(p?p.label:"—"))}${n.step?` · step ${n.step}`:""}</td>
      <td><span class="st ${esc(n.status)}">${esc(n.stText||ST_TEXT[n.status]||n.status)}</span></td>
      <td class="num muted">${a.in.length+a.out.length}</td><td class="muted num">${esc(n.updated?when(n.updated):"—")}</td></tr>`}).join("")||`<tr><td colspan="6"><div class="empty"><b>Nothing matches</b>Clear the search or turn types back on.</div></td></tr>`}
  </tbody></table></div>`;
  el.querySelectorAll("tr[data-id]").forEach(tr=>{tr.onclick=()=>select(tr.dataset.id);tr.onkeydown=e=>{if(e.key==="Enter")select(tr.dataset.id)}});

function debounce(f,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms)}}
</script>
<script>
"use strict";
/* ============================================ charts (small, dependency-free) ============================================ */
const CH={};let chId=0;
function lineChart(series,opts={}){
  const id="ch"+(++chId),W=opts.w||600,H=opts.h||220,L=54,R=12,T=14,B=28;
  const pts=series.flatMap(s=>s.pts);
  if(!pts.length)return `<div class="empty"><b>No series recorded</b>${esc(opts.empty||"")}</div>`;
  const xs=pts.map(p=>+new Date(p[0])),ys=pts.map(p=>p[1]).concat(opts.lines?opts.lines.map(l=>l.y):[]);
  let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);if(x1===x0)x1=x0+1;const pad=(y1-y0)*0.08||1;y0-=pad;y1+=pad;
  const X=t=>L+(t-x0)/(x1-x0)*(W-L-R),Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  const fy=opts.yfmt||(v=>fmtNum(v,0));
  let g="";for(let i=0;i<=4;i++){const v=y0+(y1-y0)*i/4,y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="#EEF1F5"/><text x="${L-6}" y="${y+3.5}" text-anchor="end">${esc(fy(v))}</text>`}
  for(let i=0;i<=4;i++){const t=x0+(x1-x0)*i/4;g+=`<text x="${X(t)}" y="${H-8}" text-anchor="middle">${new Date(t).toLocaleDateString("en-GB",{month:"short",year:"2-digit"})}</text>`}
  for(const l of opts.lines||[])g+=`<line x1="${L}" x2="${W-R}" y1="${Y(l.y)}" y2="${Y(l.y)}" stroke="${l.color}" stroke-dasharray="5 4" stroke-width="1.4"/><text x="${W-R}" y="${Y(l.y)-4}" text-anchor="end" style="fill:${l.color}">${esc(l.label)}</text>`;
  const paths=series.map(s=>`<path d="${s.pts.map((p,i)=>(i?"L":"M")+X(+new Date(p[0])).toFixed(1)+","+Y(p[1]).toFixed(1)).join("")}" fill="none" stroke="${s.color}" stroke-width="1.8"/>`).join("");
  CH[id]={series,X,Y,x0,x1,L,R,W,H,T,B,fy};
  const leg=series.length>1?`<div style="display:flex;gap:14px;font-size:12px;color:var(--text2);margin-top:4px">${series.map(s=>`<span><i style="display:inline-block;width:12px;height:3px;background:${s.color};vertical-align:middle;margin-right:5px"></i>${esc(s.name)}</span>`).join("")}</div>`:"";
  return `<div style="position:relative"><svg class="chart" id="${id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||"chart")}">${g}${paths}<line class="cx" y1="${T}" y2="${H-B}" stroke="#98A2B3" stroke-dasharray="3 3" style="display:none"/><g class="cd"></g></svg>
    <div class="tip" style="position:absolute" data-for="${id}"></div></div>${leg}`;
}
function bindCharts(root=document){
  root.querySelectorAll("svg.chart[id]").forEach(svg=>{
    const c=CH[svg.id];if(!c||svg._b)return;svg._b=1;const tip=svg.parentElement.querySelector(".tip");
    svg.addEventListener("pointermove",e=>{
      const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*c.W;if(x<c.L||x>c.W-c.R){tip.classList.remove("on");return}
      const t=c.x0+(x-c.L)/(c.W-c.L-c.R)*(c.x1-c.x0);
      let html="",cx=null,dots="";
      for(const s of c.series){let best=null,bd=1e18;for(const p of s.pts){const d=Math.abs(+new Date(p[0])-t);if(d<bd){bd=d;best=p}}
        if(best){cx=c.X(+new Date(best[0]));html+=`<span style="color:${s.color}">●</span> ${esc(s.name)}: <b>${esc(c.fy(best[1]))}</b><br>`;dots+=`<circle cx="${cx}" cy="${c.Y(best[1])}" r="3.5" fill="${s.color}" stroke="#fff"/>`;html=`<b>${esc(best[0])}</b><br>`+html.replace(/^<b>[^<]*<\/b><br>/,"")}}
      const l=svg.querySelector(".cx");l.setAttribute("x1",cx);l.setAttribute("x2",cx);l.style.display="";svg.querySelector(".cd").innerHTML=dots;
      tip.innerHTML=html;tip.classList.add("on");tip.style.left=Math.min(r.width-180,Math.max(0,cx/c.W*r.width+10))+"px";tip.style.top="8px";

  });
}
function monthBars(rows,target=5){
  if(!rows||!rows.length)return `<div class="empty"><b>No month rows</b></div>`;
  const W=640,H=200,L=36,B=36,T=12,bw=(W-L-8)/rows.length,maxv=Math.max(target*1.1,...rows.map(r=>r.mult));

  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" style="max-width:860px" role="img" aria-label="Month multiples against the ${target}x target">`;
  for(const v of [0,1,2,3,4,5].filter(v=>v<=maxv))s+=`<line x1="${L}" x2="${W-8}" y1="${Y(v)}" y2="${Y(v)}" stroke="#EEF1F5"/><text x="${L-6}" y="${Y(v)+3.5}" text-anchor="end">${v}x</text>`;
  rows.forEach((r,i)=>{const x=L+i*bw+2,y=Y(r.mult),c=r.mult>=target?"#15966A":r.mult<1?"#DC4C55":"#D9A441";
    s+=`<rect x="${x}" y="${y}" width="${Math.max(2,bw-4)}" height="${Y(0)-y}" rx="2" fill="${c}" fill-opacity=".85"><title>${esc(r.month)}: ${r.mult}x${r.dd!=null?", eq DD "+r.dd+"%":""}</title></rect>`;
    if(rows.length<=24&&i%(rows.length>12?2:1)===0)s+=`<text x="${x+bw/2-2}" y="${H-B+14}" text-anchor="middle">${esc(r.month.slice(2))}</text>`});
  s+=`<line x1="${L}" x2="${W-8}" y1="${Y(target)}" y2="${Y(target)}" stroke="#15966A" stroke-dasharray="5 4"/><text x="${W-10}" y="${Y(target)-4}" text-anchor="end" style="fill:#15966A">${target}x target</text>`;
  s+=`<line x1="${L}" x2="${W-8}" y1="${Y(1)}" y2="${Y(1)}" stroke="#98A2B3" stroke-dasharray="2 3"/></svg>`;
  return s+`<p class="faint" style="font-size:11.5px;margin:4px 0 0">Green: reached ${target}x · gold: 1x–${target}x · red: below the deposit. Hover a bar for the month.</p>`;
}

function bindInspector(el){
  el.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeInspector);
  el.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>select(b.dataset.go));
  el.querySelectorAll("[data-doc]").forEach(b=>b.onclick=()=>openDoc(b.dataset.doc));
  el.querySelectorAll("[data-graph]").forEach(b=>b.onclick=()=>{location.hash="#/graph?sel="+encodeURIComponent(b.dataset.graph)});
  bindCharts(el);
}
function primaryAction(id){

async function loadJob(jid){
  const el=$("#insp");
  try{
    const j=await getJSON("/api/job?id="+encodeURIComponent(jid));
    if(S.sel!=="job:"+jid)return;
    const n=S.M.nodes.get("job:"+jid);
    const res=(r,lab)=>r?`<td class="num r">${fmtPct(r.return_pct)}</td><td class="num r">${r.eq_dd_pct!=null?fmtNum(r.eq_dd_pct,2)+"%":"—"}</td><td class="num r">${fmtNum(r.pf,2)}</td><td class="num r">${fmtNum(r.trades)}</td><td class="num r">${r.win_rate!=null?fmtNum(r.win_rate,1)+"%":"—"}</td>`:"";
    const e=j.expected;
    let rows="";
    if(e)rows+=`<tr><td>Expected (Python / ledger)</td><td class="num r">${fmtPct(e.return_pct)}</td><td class="num r">${e.eq_dd_max_pct!=null?e.eq_dd_max_pct+"%":"—"}</td><td class="num r">${fmtNum(e.profit_factor,2)}</td><td class="num r">${fmtNum(e.trades)}</td><td class="num r">${e.win_rate!=null?e.win_rate+"%":"—"}</td></tr>`;
    if(j.result&&j.result.return_pct!=null)rows+=`<tr><td>${j.result_on?"Tester · legs off":"Tester"}</td>${res(j.result)}</tr>`;
    if(j.result_on&&j.result_on.return_pct!=null)rows+=`<tr><td>Tester · legs on</td>${res(j.result_on)}</tr>`;
    const series=[];if(j.result&&j.result.curve&&j.result.curve.length)series.push({name:j.result_on?"legs off":"equity",color:"#98A2B3",pts:j.result.curve});
    if(j.result_on&&j.result_on.curve&&j.result_on.curve.length)series.push({name:"legs on",color:"#3978F6",pts:j.result_on.curve});
    if(series.length===1)series[0].color="#3978F6";
    const months=j.result&&j.result.months;
    const w=j.window||[];
    const body=`<section>${kv([["Expert",j.expert],["Symbol / period",`${j.symbol||"?"} ${j.period||""}`],["Data window",`${w[0]||"?"} → ${w[1]||"?"}${w[2]==="report"?" (from the report)":w[2]==="open"?" (open-ended)":""}`],
        ["Preset",raw(`<span class="mono">${esc(j.preset)}</span>`)],["Deposit / leverage",`${fmtNum(j.deposit)} · 1:${j.leverage??"?"}`],["Inputs set",(j.set||[]).join(", ")||"none"],["Compared with",(j.compare_set||[]).join(", ")],
        ["Started",j.started?when(j.started):"not started"],["Verdict",j.verdict?`${j.verdict} (${j.verdict_source})`:"Not recorded"],["Folder",j.result?raw(`<span class="mono">${esc(j.result.folder)}</span>`):"—"]])}</section>
      ${j.status==="failed"?`<div class="note err"><b>Failed.</b> ${esc(j.note_run||j.note||"")}</div>`:""}
      <section><h4>Expected (queue.json)</h4><p>${esc(j.expect||"Not recorded")}</p></section>
      ${rows?`<section><h4>Expected vs actual</h4><div class="tbl-wrap"><table class="t"><thead><tr><th></th><th class="r">Return</th><th class="r">Eq DD</th><th class="r">PF</th><th class="r">Trades</th><th class="r">Win</th></tr></thead><tbody>${rows}</tbody></table></div>
        ${!e?`<p class="faint" style="font-size:12px;margin-top:6px">No structured expectation for this job; compare with the text above. Figures are historical Strategy Tester results, not account performance.</p>`:""}</section>`:""}
      ${series.length?`<section><h4>Strategy Tester equity (historical)</h4>${lineChart(series,{h:220,label:"Strategy Tester equity curve",yfmt:v=>fmtNum(v,0)})}</section>`:""}
      ${months?`<section><h4>Fresh-deposit months</h4>${monthBars(months,/3x/i.test(j.preset||"")?3:5)}</section>`:""}
      ${j.note?`<section><h4>Notes</h4><p>${esc(j.note)}</p>${j.note_run?`<p style="margin-top:8px">${esc(j.note_run)}</p>`:""}</section>`:""}`;
    const act=`${j.result&&j.result.summary?`<button class="btn" data-doc="${esc(j.result.summary)}">${icon("doc","sm")}summary.md</button>`:""}${j.result_on&&j.result_on.summary?`<button class="btn" data-doc="${esc(j.result_on.summary)}">${icon("doc","sm")}legs-on summary</button>`:""}<button class="btn" data-doc="docs/autopilot/runs.md">${icon("log","sm")}runs.md</button>`;
    el.innerHTML=inspectorFrame(n,body,act);bindInspector(el);
  }catch(err){if(S.sel==="job:"+jid){$(".insp-b",el).innerHTML=`<div class="empty"><b>Could not load ${esc(jid)}</b>${esc(err.message)}</div>`}}
}

function tickText(due){const d=new Date(String(due).replace(" ","T"));if(isNaN(d))return String(due);const s=(d-Date.now())/1000;
  if(s>=0)return s<60?"in "+Math.round(s)+" s":"in "+Math.floor(s/60)+" min "+String(Math.round(s%60)).padStart(2,"0")+" s";

function ring(p,color){const r=22,c=2*Math.PI*r,v=Math.max(0,Math.min(1,p));return `<svg class="ring" width="58" height="58" viewBox="0 0 58 58" aria-hidden="true"><circle cx="29" cy="29" r="${r}" fill="none" stroke="#EEF1F5" stroke-width="5"/><circle cx="29" cy="29" r="${r}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c*v} ${c}" transform="rotate(-90 29 29)"/><text x="29" y="33" text-anchor="middle" style="font:600 11px var(--sans);fill:#172033">${(v*100).toFixed(1)}%</text></svg>`}

function bindAgents(){
  const fr=$("#feedrole");if(fr)fr.onchange=renderFeed;renderFeed();

/* ============================================ pipeline ============================================ */
const PB={q:"",status:"all"};
function pagePipeline(){
  const d=S.data,pipe=d.pipeline||{steps:[],phases:{}},cands=d.candidates||[];
  const q=PB.q.toLowerCase();
  const vis=cands.filter(c=>{const st=candStatus(c);if(PB.status==="active"&&st.stopped)return false;if(PB.status==="stopped"&&!st.stopped)return false;
    return !q||JSON.stringify([c.id,c.name,c.source,c.summary,c.ea,(c.expected_tester||[])]).toLowerCase().includes(q)});
  const phases=Object.entries(pipe.phases||{}).filter(([k])=>k!=="A");
  const col=(title,sub,list,key)=>`<div class="col"><div class="col-h"><div><b>${esc(title)}</b><br><small>${esc(sub)}</small></div><span class="n">${list.length}</span></div><div class="col-b">${list.map(candCard).join("")||`<div class="empty" style="padding:16px 6px;font-size:12px">No candidate here</div>`}</div></div>`;
  const cols=phases.map(([k,name])=>{const steps=pipe.steps.filter(s=>s.phase===k);const ns=steps.map(s=>s.n);
    return col(name,`steps ${ns[0]}–${ns[ns.length-1]}`,vis.filter(c=>!candStatus(c).stopped&&ns.includes(stepNum(c.step))),k)}).join("")+col("Stopped / rejected","failed a gate or dropped",vis.filter(c=>candStatus(c).stopped),"x");
  return `<div class="page"><div class="page-h"><div><h1>Strategy Pipeline</h1><p>Candidates from docs/candidates.json in the phase of the step they reached (docs/pipeline.json). Nothing here promotes a candidate; going live stays with the owner.</p></div><span class="sp"></span>
      <div class="toolbar"><input class="f" id="pbq" type="search" placeholder="Filter by name, instrument, family…" value="${esc(PB.q)}" aria-label="Filter candidates" style="width:250px">
      <select class="f" id="pbs" aria-label="Status">${[["all","All"],["active","Active"],["stopped","Stopped / rejected"]].map(([v,l])=>`<option value="${v}"${PB.status===v?" selected":""}>${l}</option>`).join("")}</select></div></div>
    <section class="card"><div class="card-h">${icon("pipe")}<h2>The 5 steps</h2><span class="sp"></span><span class="faint" style="font-size:12px">count = active candidates at that step</span></div>
      <div class="card-b" style="display:flex;gap:6px;flex-wrap:wrap">${pipe.steps.map(s=>{const n=cands.filter(c=>stepNum(c.step)===s.n&&!candStatus(c).stopped).length;const sg=stageOfStep(s.n);
        return `<button class="chip" title="${esc(s.detail)}" data-go="stage:${sg?sg.id:"research"}" style="${n?`border-color:${sg?sg.color:"#3978F6"};color:var(--text)`:""}"><b class="num">${s.n}</b> ${esc(clip(s.name,26))}${n?` <span class="tagx" style="background:${sg?sg.color:"#3978F6"};color:#fff">${n}</span>`:""}${s.n===19?" "+icon("lock","sm"):""}</button>`}).join("")}</div></section>
    <div class="board">${cols}</div>
    <section class="card"><div class="card-h">${icon("alert")}<h2>Rejected families</h2><span class="sp"></span><span class="faint" style="font-size:12px">checked by the finder before any new idea</span></div>
      <div class="tbl-wrap"><table class="t"><thead><tr><th>Family</th><th>Examples</th><th>Why</th></tr></thead><tbody>${(d.rejected_families||[]).map(r=>`<tr style="cursor:default"><td><b style="font-weight:500">${esc(r.family)}</b></td><td class="muted">${esc(r.examples)}</td><td>${esc(r.why)}</td></tr>`).join("")||`<tr><td colspan="3" class="faint">None recorded.</td></tr>`}</tbody></table></div></section></div>`;
}
function candCard(c){
  const st=candStatus(c),t=(c.tester||[])[0],sym=[...new Set([].concat(c.expected_tester||[]).map(e=>e.symbol).filter(Boolean))];
  return `<div class="ccard ${S.sel==="cand:"+c.id?"sel":""}" data-id="cand:${esc(c.id)}" tabindex="0"><div class="nm">${esc(c.name||c.id)}</div>
    <div class="meta"><span class="tagx num">step ${esc(c.step??"?")}</span>${stChip(st.cls,st.text)}${sym.map(s=>`<span class="tagx">${esc(s)}</span>`).join("")}</div>
    ${t?`<div class="ln num">Tester: ${esc(t.symbol||"")} ${esc(t.trades??"?")} trades, PF ${esc(t.profit_factor??"?")}${t.return_pct!=null?", "+fmtPct(t.return_pct):""}</div>`:""}
    ${st.stopped?`<div class="ln neg">Stopped at step ${esc(c.step)}: ${esc(clip(st.reason,120))}</div>`:c.summary?`<div class="ln">${esc(clip(c.summary,120))}</div>`:""}
    <div class="ln faint">Next action: not recorded in the ledger</div></div>`;
}
function bindPipeline(){
  const q=$("#pbq");if(!q)return;
  q.oninput=debounce(e=>{PB.q=e.target.value;rerender("#pbq")},200);
  $("#pbs").onchange=e=>{PB.status=e.target.value;render()};
}

/* ============================================ decision log ============================================ */
const DL={role:"",kind:"",range:"all",q:""};
function pageDecisions(){
  const d=S.data,all=(d.decisions||[]).filter(x=>!x.bad_line),bad=(d.decisions||[]).filter(x=>x.bad_line);
  const roles=[...new Set(all.map(x=>x.role))],kinds=[...new Set(all.map(x=>x.kind))];
  const cut=DL.range==="24h"?Date.now()-864e5:DL.range==="7d"?Date.now()-6048e5:0,q=DL.q.toLowerCase();
  const list=all.filter(x=>(!DL.role||x.role===DL.role)&&(!DL.kind||x.kind===DL.kind)&&(!cut||new Date(x.when)>=cut)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));
  const qs=list.filter(x=>x.kind==="question"),rest=list.filter(x=>x.kind!=="question");
  const L=d.lessons||{items:[]},lim=L.limit||40;
  const docs=d.docs||{};
  const row=x=>`<div class="row" data-go="decision:${x._line}" tabindex="0"><div class="ic tone-${x.kind==="question"?"warn":x.kind==="lesson"?"gold":"ok"}">${icon(x.kind==="question"?"q":x.kind==="lesson"?"lesson":"check","sm")}</div>
    <div style="min-width:0"><div class="t">${esc(x.decision)}</div><div class="d">${esc(x.why||"")}</div><div class="faint mono" style="font-size:11.5px;margin-top:3px">${esc(x.evidence||"")}</div></div>
    <div class="w">${esc(when(x.when))}<br><span class="tagx">${esc(x.role)}</span> <span class="tagx">${esc(x.kind)}</span></div></div>`;
  return `<div class="page"><div class="page-h"><div><h1>Decision Log</h1><p>docs/memory/decisions.jsonl, newest first. Append-only: written through tools/memory.py decide; nothing here edits it.</p></div><span class="sp"></span>
    <div class="toolbar"><input class="f" id="dlq" type="search" placeholder="Search decisions…" value="${esc(DL.q)}" aria-label="Search decisions" style="width:200px">
      <select class="f" id="dlr" aria-label="Role"><option value="">All roles</option>${roles.map(r=>`<option${DL.role===r?" selected":""}>${esc(r)}</option>`).join("")}</select>
      <select class="f" id="dlk" aria-label="Kind"><option value="">All kinds</option>${kinds.map(r=>`<option${DL.kind===r?" selected":""}>${esc(r)}</option>`).join("")}</select>
      <select class="f" id="dlt" aria-label="Time range">${[["all","All time"],["24h","Last 24 h"],["7d","Last 7 days"]].map(([v,l])=>`<option value="${v}"${DL.range===v?" selected":""}>${l}</option>`).join("")}</select></div></div>
    ${bad.length?`<div class="note err">${bad.length} line(s) of decisions.jsonl are not valid JSON (lines ${bad.map(b=>b.bad_line).join(", ")}).</div>`:""}
    <div class="ov-mid"><div style="display:flex;flex-direction:column;gap:16px">
      ${qs.length?`<section class="card" style="border-color:#F1DDB5"><div class="card-h">${icon("q")}<h2>Open questions for the owner</h2><span class="sp"></span><span class="tagx">${qs.length}</span></div><div class="list">${qs.map(row).join("")}</div></section>`:""}
      <section class="card"><div class="card-h">${icon("log")}<h2>Decisions</h2><span class="sp"></span><span class="faint num" style="font-size:12px">${rest.length} shown</span></div><div class="list">${rest.map(row).join("")||`<div class="empty"><b>Nothing matches</b></div>`}</div></section></div>
      <div style="display:flex;flex-direction:column;gap:16px">
        <section class="card"><div class="card-h">${icon("lesson")}<h2>Lessons</h2><span class="sp"></span><span class="num" style="font-size:13px;font-weight:600">${L.items.length} / ${lim}</span></div>
          <div class="card-b" style="padding-bottom:6px"><div class="bar-h"><i style="width:${Math.min(100,L.items.length/lim*100)}%"></i></div></div>

function palette(){
  const items=[...PAGES.map(([id,l,ic])=>({t:l,sub:"page",ic,go:()=>location.hash="#/"+id})),
    {t:"AurumHydra",sub:"product",ic:"hex",go:()=>location.hash="#/product/hydra"},{t:"AurumFunded",sub:"product",ic:"hex",go:()=>location.hash="#/product/funded"},
    ...(S.M?[...S.M.nodes.values()].map(n=>({t:n.full||n.label,sub:TYPES[n.type].label+(n.stText?" · "+n.stText:""),ic:n.icon||TYPES[n.type].icon,go:()=>select(n.id)})):[])];
  const m=modal("Search",`<div class="palette" style="margin:-16px -20px"><input id="pq" placeholder="Search pages, candidates, jobs, agents, papers, decisions…" aria-label="Search" autocomplete="off"><div class="res" id="pres" role="listbox"></div></div>`,{noHead:true,cls:"palette"});
  const inp=$("#pq",m.el),res=$("#pres",m.el);let cur=0,shown=[];
  const draw=()=>{const q=inp.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    shown=items.filter(i=>q.every(w=>(i.t+" "+i.sub).toLowerCase().includes(w))).slice(0,40);cur=Math.min(cur,Math.max(0,shown.length-1));
    res.innerHTML=shown.map((i,k)=>`<div class="it ${k===cur?"on":""}" role="option" aria-selected="${k===cur}" data-k="${k}">${icon(i.ic,"sm")}<span>${esc(clip(i.t,80))}</span><small>${esc(clip(i.sub,40))}</small></div>`).join("")||`<div class="empty">No match</div>`;
    res.querySelectorAll(".it").forEach(el=>el.onclick=()=>{m.close();shown[+el.dataset.k].go()})};
  inp.oninput=()=>{cur=0;draw()};
  inp.onkeydown=e=>{if(e.key==="ArrowDown"){cur=Math.min(cur+1,shown.length-1);draw();e.preventDefault()}else if(e.key==="ArrowUp"){cur=Math.max(cur-1,0);draw();e.preventDefault()}
    else if(e.key==="Enter"&&shown[cur]){m.close();shown[cur].go()}};
  draw();inp.focus();
}
function init(){
  if(store("reduce"))document.documentElement.classList.add("reduce");
  if(store("collapsed"))$("#app").classList.add("collapsed");
  $("#collapse").onclick=()=>{const c=$("#app").classList.toggle("collapsed");store("collapsed",c);setTimeout(()=>{if(G.view[S.gmode])fitView()},220)};
  $("#menu").onclick=()=>$("#app").classList.toggle("drawer");
  $("#nav").addEventListener("click",()=>$("#app").classList.remove("drawer"));
  document.addEventListener("click",e=>{const app=$("#app");if(app.classList.contains("drawer")&&!e.target.closest(".side")&&!e.target.closest("#menu"))app.classList.remove("drawer")});
  $("#searchbtn").onclick=palette;
  $("#bell").onclick=e=>{e.stopPropagation();const p=$("#bellpop");p.classList.toggle("hide");S.unseen=0;renderTop();
    p.innerHTML=`<div class="card-h"><h2>Changes since this page opened</h2></div><div class="list">${S.changes.map((c,i)=>`<div class="row" data-ch="${i}"><div style="min-width:0"><div class="t">${esc(c.t)}</div><div class="d">${esc(c.s)}</div></div><div class="w">${esc(ago(c.at))}</div></div>`).join("")||`<div class="empty">No change seen yet. Job status changes, new decisions and approval changes show here.</div>`}</div>`;
    p.querySelectorAll("[data-ch]").forEach(r=>r.onclick=()=>{p.classList.add("hide");select(S.changes[+r.dataset.ch].go)})};
  document.addEventListener("click",e=>{if(!e.target.closest("#bellpop")&&!e.target.closest("#bell"))$("#bellpop").classList.add("hide")});
  document.addEventListener("keydown",e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();palette()}
    else if(e.key==="/"&&!e.target.closest("input,textarea,select")){e.preventDefault();palette()}
    else if(e.key==="Escape"&&!$(".scrim")){if($("#insp").classList.contains("on"))closeInspector();$("#app").classList.remove("drawer")}
  });
  window.addEventListener("hashchange",()=>{$("#app").classList.remove("drawer");render()});
  setInterval(()=>{$("#clock").textContent=new Date().toLocaleString("en-GB",{weekday:"short",day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:false});
    const nt=$("#nexttick"),rel=(S.live&&S.live.relay)||(S.data&&S.data.relay);if(nt&&rel&&rel.due)nt.textContent=tickText(rel.due);renderTop()},1000);
  render();loadResearch();connect();
  setInterval(()=>loadResearch(),15000);
}
init();
</script>
</body>
</html>
